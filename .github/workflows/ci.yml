# .github/workflows/ci.yml
# Checagens a cada push e pull request: tipos, lint, formatação e testes.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Expo SDK 54 exige Node >= 20.19
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm test -- --ci
